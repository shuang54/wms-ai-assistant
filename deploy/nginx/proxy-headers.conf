# ============================================================================
# 可信代理转发头（生产网关专用片段）
#
# 设计要点：
#   · 本层就是**唯一的** TLS 边缘 ⇒ 转发头由本层**覆盖**，不透传客户端值。
#   · X-Forwarded-For 用 $remote_addr（不是 $proxy_add_x_forwarded_for）：
#     客户端自带的 XFF **被丢弃**，避免伪造链。
#   · Host / X-Forwarded-Host 用 $server_name（不是 $host）：
#     $host 取自客户端 Host 头，可被伪造（Phase 8 Step 2 已用真实请求证实
#     上游曾收到客户端自定的 Host）；$server_name 恒等于本 server 块的
#     server_name（即部署时的 <PRODUCTION_HOST>），彻底消除 Host 头注入。
#   · 后端目前**不读取**任何 X-Forwarded-*（见 docs/security.md §7.1），
#     因此即便被覆盖也不会改变认证 / 授权判定；此处保持"最小且正确"。
#   · 若将来后端需要信任这些头，必须先限定 uvicorn 的
#     --forwarded-allow-ips（仅回环），并确保后端只经本网关可达。
# ============================================================================

proxy_set_header Host              $server_name;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $server_name;
proxy_set_header X-Forwarded-Port  $server_port;

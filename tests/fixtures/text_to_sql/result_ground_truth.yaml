# Phase 3.9.13 — Text-to-SQL Result Ground Truth
#
# Concept separation (§22 / §23):
#
#   text_to_sql_regression.yaml   -> structural expectations (unchanged)
#   result_ground_truth.yaml      -> RESULT-level ground truth (this file)
#   t2s_eval_schema.sql / _data   -> the deterministic fixture the truth
#                                    is computed against
#
# Ground truth source (§24 / §25):
#   Manually designed fixture data + manually computed expected results.
#   NOT generated by DeepSeek, and NOT copied from the output of the SQL
#   under evaluation. SQL/Python was only used to double-check the
#   arithmetic that was derived by hand from the fixture rows above.
#
# Assumption:
#   Expectations assume the evaluated SQL runs against the `t2s_eval`
#   fixture schema (see the sibling SQL files). The current regression
#   dataset still points at `public.*`, so a future evaluation phase must
#   bind the project schema to `t2s_eval` for these truths to apply.
#
# Precedence:
#   For any case_id present here, this file supersedes the optional
#   `result_expectation` embedded in the regression dataset (which was
#   written in Phase 3.9.10 when the public tables were empty).
#
# Cases without an entry -> result = N/A (never counted as a failure).

version: "1.0"
schema: t2s_eval

cases:
  # 1) Simple list: all 4 documents.
  - case_id: simple_document_list
    expectation:
      type: column_values
      column: id
      values: [1, 2, 3, 4]
      ordered: false

  # 2) Top-N: highest token_count first, tie-free.
  - case_id: top_n_chunks_by_token_count
    expectation:
      type: column_values
      column: token_count
      values: [100, 90, 80, 70, 60, 50, 40, 30, 20, 10]
      ordered: true

  # 4) ORDER BY token_count DESC (no ties -> prefix-stable for LIMIT >= 10).
  - case_id: chunks_ordered_by_token_count
    expectation:
      type: column_values
      column: token_count
      values: [100, 90, 80, 70, 60, 50, 40, 30, 20, 10]
      ordered: true

  # 5) Aggregation: COUNT(*) over documents.
  - case_id: aggregate_document_count
    expectation:
      type: scalar
      value: 4

  # 6) GROUP BY document_id -> chunk counts 2 / 3 / 1 / 4.
  - case_id: group_by_chunk_count_per_document
    expectation:
      type: unordered_rows
      rows:
        - [1, 2]
        - [2, 3]
        - [3, 1]
        - [4, 4]

  # 7) HAVING COUNT(*) > 2 -> only documents 2 (3 chunks) and 4 (4 chunks).
  - case_id: having_chunk_count_greater_than
    expectation:
      type: unordered_rows
      rows:
        - [2, 3]
        - [4, 4]

  # 8) JOIN: 10 chunks, each carrying its parent document title
  #    (2x Alpha, 3x Beta, 1x Gamma, 4x Delta).
  - case_id: join_chunk_with_parent_document
    expectation:
      type: column_values
      column: title
      values:
        - "Alpha Report"
        - "Alpha Report"
        - "Beta Notes"
        - "Beta Notes"
        - "Beta Notes"
        - "Gamma Guide"
        - "Delta Manual"
        - "Delta Manual"
        - "Delta Manual"
        - "Delta Manual"
      ordered: false

  # 9) Date filter: created_at after 2026-01-01 -> documents 2 and 3.
  - case_id: date_filter_created_after
    expectation:
      type: column_values
      column: id
      values: [2, 3]
      ordered: false

  # 10) LIMIT 10 over 4 rows -> all documents.
  - case_id: limit_first_10_documents
    expectation:
      type: column_values
      column: id
      values: [1, 2, 3, 4]
      ordered: false

  # 11) Semantic-dependent: chunks per document (same shape as case 6).
  - case_id: semantic_dependent_document_and_chunk
    expectation:
      type: unordered_rows
      rows:
        - [1, 2]
        - [2, 3]
        - [3, 1]
        - [4, 4]

  # 13) Project A inventory.
  - case_id: project_a_inventory
    expectation:
      type: unordered_rows
      rows:
        - ["item_x", 100]
        - ["item_y", 5]

  # 14) Project B inventory — SAME item_code, DIFFERENT qty (isolation).
  - case_id: project_b_inventory
    expectation:
      type: unordered_rows
      rows:
        - ["item_x", 999]
        - ["item_y", 7]

# Deliberately absent:
#   filtered_documents_by_file_type
#       The question does not name the file_type value, so no single
#       deterministic result set exists (§27: prefer N/A over fragile data).
#   safety_delete_all_documents
#       Security-boundary case — no result ground truth (§28). It stays
#       covered by the Phase 3.9.7 / 3.9.8 security E2E tests.

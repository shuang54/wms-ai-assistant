# Text-to-SQL Regression Dataset（Phase 3.9.3）
#
# 用途：以后修改 Prompt / Semantic / RelevantTableSelector / Model /
#       Context 时，用固定问题集自动验证是否发生回归。
#
# 设计原则：
#   1. **结构期望，不是精确 SQL** —— 同一问题存在多种合法 SQL，
#      字符串相等会制造大量假失败；
#   2. **不虚构字段** —— 所有 table / column 都取自当前真实 Schema：
#        public.knowledge_document（含 file_type / status / created_at / ...）
#        public.knowledge_chunk（含 document_id / token_count / created_at / ...）
#        FK / 业务关系：knowledge_chunk.document_id → knowledge_document.id
#      （project-a / project-b 的 inventory 表见 §十 隔离 fixture）；
#   3. **默认不执行 SQL** —— 全数据集可在无数据库环境下运行；
#      DB 测试按需用 with_execution_required() 打开；
#   4. table / column 期望由 sqlglot AST 判定（含 alias 解析），
#      must_not_contain 也是 AST 判定（字符串字面量不算命中）。

_schema_doc: >-
  Text-to-SQL Regression Cases (Phase 3.9.3). Structural expectations only —
  no exact expected SQL. Cases run offline with a deterministic Fake Generator
  by default; must_execute stays unset so pytest never requires a database.
_schema_version: "1.0"
_fields:
  id: "string, required, unique across the dataset"
  question: "string, required, non-empty natural language question"
  project_id: "string, optional, resolved by EvaluationContextResolver"
  expected.must_pass_validation: "bool, optional; false = SQL must be REJECTED by SQLValidator (security boundary)"
  expected.must_contain_tables: "list of 'table' or 'schema.table', all must appear in the AST"
  expected.must_contain_columns: "list of 'column' or 'table.column', all must appear in the AST (aliases resolved)"
  expected.must_not_contain: "list of forbidden identifiers; any hit fails the case"
  expected.must_execute: "bool, optional; true = SQL must execute successfully (requires executor)"

cases:
  # ---- Case 1：简单查询 ----
  - id: simple_document_list
    semantic_expectation:
      # Phase 3.9.17: question "查询知识文档列表" 只要求文档标识符
      # ("列表" 的最小回答 = 每个文档一个标识符)。
      # 其他列（title / file_type / created_at）属于合理附加信息，不是 question 强制要求。
      required_columns: [id]
      optional_columns: [title, file_type, created_at]
      forbidden_columns: []
      expected_rows:
        - [1]
        - [2]
        - [3]
        - [4]
      row_matching: unordered
    question: "查询知识文档列表"
    project_id: vietnam-wms
    expected:
      must_pass_validation: true
      must_contain_tables:
        - public.knowledge_document
    # Phase 3.9.10：结果级预期（可选）。测试库 knowledge_document 当前为空，
    # 因此确定期望为「0 行」——确定性可重复，不依赖动态数据。
    result_expectation:
      type: exact_rows
      rows: []

  # ---- Case 2：Top N ----
  - id: top_n_chunks_by_token_count
    semantic_expectation:
      # Phase 3.9.17: "分词数量最多" 明确把 token_count 作为排序与筛选标准 → required。
      # "知识分片" 的最小标识符是 chunk id → required。
      # 排序是 question 语义的一部分（"最多"），因此 row_matching: ordered。
      # document_id / content 是合理附加列，非 question 强制要求。
      required_columns: [id, token_count]
      optional_columns: [document_id, content]
      forbidden_columns: []
      expected_rows:
        - [10, 100]
        - [9, 90]
        - [8, 80]
        - [7, 70]
        - [6, 60]
        - [5, 50]
        - [4, 40]
        - [3, 30]
        - [2, 20]
        - [1, 10]
      row_matching: ordered
    question: "查询分词数量最多的10个知识分片"
    project_id: vietnam-wms
    expected:
      must_pass_validation: true
      must_contain_tables:
        - public.knowledge_chunk
      must_contain_columns:
        - knowledge_chunk.token_count

  # ---- Case 3：条件过滤 ----
  - id: filtered_documents_by_file_type
    question: "查询文件类型为指定类型的知识文档"
    project_id: vietnam-wms
    expected:
      must_pass_validation: true
      must_contain_tables:
        - public.knowledge_document
      must_contain_columns:
        - knowledge_document.file_type

  # ---- Case 4：排序 ----
  - id: chunks_ordered_by_token_count
    semantic_expectation:
      # Phase 3.9.17: question 明确要求"从高到低排序" → row_matching: ordered。
      # token_count 是排序与展示的核心值 → required。
      # chunk id 是分片标识符 → required。
      # document_id / content 是附加信息，非 question 强制。
      required_columns: [id, token_count]
      optional_columns: [document_id, content]
      forbidden_columns: []
      expected_rows:
        - [10, 100]
        - [9, 90]
        - [8, 80]
        - [7, 70]
        - [6, 60]
        - [5, 50]
        - [4, 40]
        - [3, 30]
        - [2, 20]
        - [1, 10]
      row_matching: ordered
    question: "查询知识分片并按照分词数量从高到低排序"
    project_id: vietnam-wms
    expected:
      must_pass_validation: true
      must_contain_tables:
        - public.knowledge_chunk
      must_contain_columns:
        - knowledge_chunk.token_count

  # ---- Case 5：聚合 ----
  - id: aggregate_document_count
    semantic_expectation:
      # Phase 3.9.17: COUNT(*) 产生 1×1 scalar。
      # PostgreSQL 默认列名为 "count"；与 3.9.16 报告口径一致，
      # 实际 saved actual 列名正是 "count"。
      # ⚠ 已知限制（PHASE_3_9_18_CANDIDATE）：
      #   若 SQL 改写为 COUNT(c.id) AS total_documents，
      #   本期望将因 MISSING_REQUIRED_COLUMN 而 FAIL。
      #   通用列名 alias mapping 在 3.9.18 之前**不实现**。
      required_columns: [count]
      optional_columns: []
      forbidden_columns: []
      expected_rows:
        - [4]
      row_matching: unordered
    question: "统计知识文档总数"
    project_id: vietnam-wms
    expected:
      must_pass_validation: true
      must_contain_tables:
        - public.knowledge_document
    # Phase 3.9.10：COUNT 单值查询 → 测试库为空，确定期望为 0。
    result_expectation:
      type: scalar
      value: 0

  # ---- Case 6：GROUP BY ----
  - id: group_by_chunk_count_per_document
    semantic_expectation:
      # Phase 3.9.16: 业务必需的列 = 文档标识 + 分片数量；title 是合理附加列。
      # 实际 LLM 投影为 `id`（非 `document_id`），以真实列名为准。
      required_columns: [id, chunk_count]
      optional_columns: [title]
      forbidden_columns: []
      expected_rows:
        - [1, 2]
        - [2, 3]
        - [3, 1]
        - [4, 4]
      row_matching: unordered
    question: "统计每个知识文档的知识分片数量"
    project_id: vietnam-wms
    expected:
      must_pass_validation: true
      must_contain_tables:
        - public.knowledge_chunk
      must_contain_columns:
        - knowledge_chunk.document_id

  # ---- Case 7：HAVING ----
  - id: having_chunk_count_greater_than
    semantic_expectation:
      # Phase 3.9.16: question 只要求"哪些文档满足条件"，
      # 因此只需要文档标识；count 是 HAVING 谓词而非投影，不强制要求。
      required_columns: [id]
      optional_columns: [title, chunk_count]
      forbidden_columns: []
      expected_rows:
        - [2]
        - [4]
      row_matching: unordered
    question: "查询知识分片数量超过2个的知识文档"
    project_id: vietnam-wms
    expected:
      must_pass_validation: true
      must_contain_tables:
        - public.knowledge_chunk
      must_contain_columns:
        - knowledge_chunk.document_id

  # ---- Case 8：JOIN（真实 FK / 业务关系） ----
  - id: join_chunk_with_parent_document
    semantic_expectation:
      # Phase 3.9.17: question 明确要求"知识分片**及其所属知识文档的标题**"——
      # 既要分片，又要文档标题。两项都是 question 直接要求 → 都是 required。
      # chunk content 是分片的天然属性，但 question 没明说 → optional。
      required_columns: [id, title]
      optional_columns: [content, document_id]
      forbidden_columns: []
      expected_rows:
        - [1, "Alpha Report"]
        - [2, "Alpha Report"]
        - [3, "Beta Notes"]
        - [4, "Beta Notes"]
        - [5, "Beta Notes"]
        - [6, "Gamma Guide"]
        - [7, "Delta Manual"]
        - [8, "Delta Manual"]
        - [9, "Delta Manual"]
        - [10, "Delta Manual"]
      row_matching: unordered
    question: "查询知识分片及其所属知识文档的标题"
    project_id: vietnam-wms
    expected:
      must_pass_validation: true
      must_contain_tables:
        - public.knowledge_chunk
        - public.knowledge_document
      must_contain_columns:
        - knowledge_chunk.document_id
        - knowledge_document.title

  # ---- Case 9：日期条件（Schema 确有 created_at） ----
  - id: date_filter_created_after
    semantic_expectation:
      # Phase 3.9.17: 日期过滤只决定 row set，不改变 projection 语义。
      # question 问的是"哪些文档"→ 文档标识符 (id) 是 required。
      # title / file_type / created_at 都是附加展示列，question 未强制。
      required_columns: [id]
      optional_columns: [title, file_type, created_at]
      forbidden_columns: []
      expected_rows:
        - [2]
        - [3]
      row_matching: unordered
    question: "查询2026年1月1日之后创建的知识文档"
    project_id: vietnam-wms
    expected:
      must_pass_validation: true
      must_contain_tables:
        - public.knowledge_document
      must_contain_columns:
        - knowledge_document.created_at

  # ---- Case 10：LIMIT ----
  - id: limit_first_10_documents
    semantic_expectation:
      # Phase 3.9.17: LIMIT 10 ≠ "特定投影"。
      # row count requirement = 不超过 10；
      # row identity = 所有 4 个文档（fixture 中实际只有 4 个文档）；
      # projection = id 是 question 唯一明确的字段。
      # question 未指定排序 → unordered。
      required_columns: [id]
      optional_columns: [title, file_type, created_at]
      forbidden_columns: []
      expected_rows:
        - [1]
        - [2]
        - [3]
        - [4]
      row_matching: unordered
    question: "查询前10条知识文档"
    project_id: vietnam-wms
    expected:
      must_pass_validation: true
      must_contain_tables:
        - public.knowledge_document
    # Phase 3.9.10：LIMIT 10 → 测试库为空，确定期望为「0 行」。
    result_expectation:
      type: exact_rows
      rows: []

  # ---- Case 11：Semantic-dependent（依赖业务语义才能理解 文档 / 分片） ----
  - id: semantic_dependent_document_and_chunk
    semantic_expectation:
      # Phase 3.9.16: 与 Case A 同形。
      required_columns: [id, chunk_count]
      optional_columns: [title]
      forbidden_columns: []
      expected_rows:
        - [1, 2]
        - [2, 3]
        - [3, 1]
        - [4, 4]
      row_matching: unordered
    question: "查询每个文档包含多少个分片"
    project_id: vietnam-wms
    expected:
      must_pass_validation: true
      must_contain_tables:
        - public.knowledge_document
        - public.knowledge_chunk
      must_contain_columns:
        - knowledge_chunk.document_id

  # ---- Case 12：安全边界（必须被 SQLValidator 拒绝） ----
  - id: safety_delete_all_documents
    question: "删除知识文档表中的所有数据"
    project_id: vietnam-wms
    expected:
      must_pass_validation: false

  # ---- Case 13/14：Project Isolation（同问句，不同项目） ----
  - id: project_a_inventory
    semantic_expectation:
      # Phase 3.9.17: "库存明细" 的最小回答 = item_code (标识) + qty (业务答案)。
      # 两条都是核心数据 → 全部 required。
      # 3.9.14 实际投影 (item_code, qty) 与 expected 完全一致。
      required_columns: [item_code, qty]
      optional_columns: []
      forbidden_columns: []
      expected_rows:
        - ["item_x", 100]
        - ["item_y", 5]
      row_matching: unordered
    question: "查询库存明细"
    project_id: eval-project-a
    expected:
      must_pass_validation: true
      must_contain_tables:
        - project_a.inventory
      must_not_contain:
        - project_b.inventory

  - id: project_b_inventory
    semantic_expectation:
      # Phase 3.9.17: 与 project_a 同形，但 qty 不同（隔离验证）。
      # A != B 的项目隔离语义由 strict 已覆盖；此处只保证值正确。
      required_columns: [item_code, qty]
      optional_columns: []
      forbidden_columns: []
      expected_rows:
        - ["item_x", 999]
        - ["item_y", 7]
      row_matching: unordered
    question: "查询库存明细"
    project_id: eval-project-b
    expected:
      must_pass_validation: true
      must_contain_tables:
        - project_b.inventory
      must_not_contain:
        - project_a.inventory
